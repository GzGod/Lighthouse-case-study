<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lighthouse · Public Case Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Inter+Tight:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>

  :root{--canvas:#f5f6f8;--surface:#ffffff;--surface-muted:#f0f2f5;--ink:#151a23;--ink-2:#11151c;--ink-3:#ffffff;--bone:#151a23;--bone-dim:#586575;--secondary:#586575;--accent:#08748c;--accent-soft:#08748c;--brand:#089bb3;--teal:#08748c;--ember:#08748c;--ember-soft:#08748c;--border:#e2e6eb;--rule:#e2e6eb;--rule-strong:#d0d6df;--success:#217358;--danger:#ac3546;}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:"Inter","Noto Sans SC",system-ui,-apple-system,sans-serif}
  .mono{font-family:"JetBrains Mono",monospace}.display{font-family:"Space Grotesk","Noto Sans SC",sans-serif}.hair{border-color:var(--rule)}
  .grid-bg{background-image:linear-gradient(to right,rgba(237,232,225,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(237,232,225,.035) 1px,transparent 1px);background-size:72px 72px}
  ::selection{background:rgba(255,122,69,.45);color:#fff}
</style>
