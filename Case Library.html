<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lighthouse · Public Case Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Inter+Tight:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="/shared-nav.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root{--canvas:#f0f7ff;--surface:#ffffff;--surface-muted:#e8f1fb;--ink:#0a0d14;--ink-2:#0e1520;--ink-3:#182030;--bone:#0a0d14;--bone-dim:#4b6080;--secondary:#4b6080;--subtle:#6b7d96;--accent:#1d6fda;--accent-soft:#3b82f6;--accent-hover:#1558b8;--on-accent:#ffffff;--brand:#1d6fda;--teal:#1d6fda;--ember:#1d6fda;--ember-soft:#3b82f6;--border:#c7ddf8;--rule:#c7ddf8;--rule-strong:#a8c8f5;--green:#4ade80;--green-soft:#86efac;--dark:#080d14;--dark-2:#0e1824;--success:#15803d;--danger:#b91c1c;}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:"Inter","Noto Sans SC",system-ui,-apple-system,sans-serif}
  .mono{font-family:"JetBrains Mono",monospace}.display{font-family:"Space Grotesk","Noto Sans SC",sans-serif}.hair{border-color:var(--rule)}
  .grid-bg{background-image:linear-gradient(to right,rgba(237,232,225,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(237,232,225,.035) 1px,transparent 1px);background-size:72px 72px}
  ::selection{background:rgba(255,122,69,.45);color:#fff}
</style>
</head>
<body><div id="case-library-root"></div><script type="text/babel" src="/case-library.jsx"></script></body>
