<style>
  :root{
    /* Lighthouse — Blue-white light theme + green/black dark accents */
    --canvas:#f0f7ff;
    --surface:#ffffff;
    --surface-muted:#e8f1fb;
    --elevated:#ffffff;
    --ink:#0a0d14;
    --ink-2:#0e1520;
    --ink-3:#182030;
    --bone:#0a0d14;
    --bone-dim:#4b6080;
    --secondary:#4b6080;
    --subtle:#6b7d96;
    --accent:#1d6fda;
    --accent-soft:#3b82f6;
    --accent-hover:#1558b8;
    --on-accent:#ffffff;
    --brand:#1d6fda;
    --display-accent:#1d6fda;
    --cyan:#0ea5e9;
    --teal:#1d6fda;
    --ember:#1d6fda;
    --ember-soft:#3b82f6;
    --border:#c7ddf8;
    --rule:#c7ddf8;
    --rule-strong:#a8c8f5;
    --control-border:#b0cdf0;
    --accent-border:#bbd6f8;
    /* Green accent for dark sections */
    --green:#4ade80;
    --green-soft:#86efac;
    --green-dim:#22c55e;
    --green-border:#166534;
    /* Dark section bg */
    --dark:#080d14;
    --dark-2:#0e1824;
    --amber:#f59e0b;
    --success:#15803d;
    --warning:#b45309;
    --danger:#b91c1c;
  }
  html,body{background:var(--canvas);color:var(--ink);font-family:"Inter","Noto Sans SC",system-ui,-apple-system,sans-serif;}
  html[lang="en"] .font-cn,html[lang="en"] .font-cn-serif{font-family:"Inter",system-ui,sans-serif;}
  html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{overflow-wrap:anywhere;}
  .font-display{font-family:"Inter Tight","Inter","Noto Serif SC",serif;font-feature-settings:"ss01";letter-spacing:-0.015em;}
  .font-mono{font-family:"JetBrains Mono",ui-monospace,monospace;}
  .font-cn{font-family:"Inter","Noto Sans SC",system-ui,sans-serif;}
  .font-cn-serif{font-family:"Inter","Noto Serif SC",serif;}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  .kicker{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--bone-dim);}
  .rule-t{border-top:1px solid var(--border);}
  .rule-b{border-bottom:1px solid var(--border);}
  .rule-l{border-left:1px solid var(--border);}
  .grid-bg{
    background-image:
      linear-gradient(to right, rgba(29,111,218,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(29,111,218,0.06) 1px, transparent 1px);
    background-size:80px 80px;
  }
  .ember-glow{text-shadow:none;}
  .teal-glow{text-shadow:none;}
  .bone-glow{text-shadow:none;}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.6,.2,1), transform .9s cubic-bezier(.2,.6,.2,1);}
  .reveal.in{opacity:1;transform:translateY(0);}
  .reveal-d1{transition-delay:.08s;} .reveal-d2{transition-delay:.16s;} .reveal-d3{transition-delay:.24s;} .reveal-d4{transition-delay:.32s;} .reveal-d5{transition-delay:.4s;}
  /* Background images removed — replaced with CSS gradients */
  .hero-img{background:linear-gradient(180deg,#ffffff 0%,#f6faff 40%,#eaf3ff 100%);}
  .divider-img-1{background:linear-gradient(135deg,#080d14 0%,#0e1824 100%);}
  .divider-img-2{background:linear-gradient(135deg,#0e1824 0%,#0a1520 100%);}
  .divider-img-3{background:linear-gradient(135deg,#080d14 0%,#091220 100%);}
  .divider-img-4{background:linear-gradient(135deg,#0e1824 0%,#080d14 100%);}
  .vignette-b{background:linear-gradient(to bottom, rgba(240,247,255,0) 0%, rgba(240,247,255,0.8) 85%, var(--canvas) 100%);}
  .vignette-t{background:linear-gradient(to top, rgba(240,247,255,0) 0%, rgba(240,247,255,0.8) 85%, var(--canvas) 100%);}
  .vignette-all{background:radial-gradient(ellipse at center, transparent 0%, rgba(8,13,20,0.6) 100%);}
  .radial-ember{background:radial-gradient(ellipse 70% 55% at 50% 90%, rgba(74,222,128,0.12), transparent 70%);}
  .radial-teal{background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(29,111,218,0.08), transparent 70%);}
  .ring-soft{box-shadow:inset 0 0 0 1px var(--border);}
  .stat-card{background:linear-gradient(180deg, rgba(29,111,218,0.03), rgba(255,255,255,0));}
  .dot{width:6px;height:6px;border-radius:999px;display:inline-block;}
  .scroll-snap{scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .scroll-snap>*{scroll-snap-align:start;}
  .ring-lamp{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 100%, rgba(74,222,128,0.18), transparent 55%);mix-blend-mode:screen;}
  .hairline{height:1px;background:linear-gradient(to right, transparent, var(--rule-strong), transparent);}
  .tablet-hide{}
  @media (max-width:640px){ .hide-sm{display:none;} }
  .recharts-cartesian-axis-tick-value{fill:var(--bone-dim)!important;font-family:"JetBrains Mono",monospace;font-size:11px;}
  .recharts-cartesian-axis-line, .recharts-cartesian-axis-tick-line{stroke:var(--rule-strong);}
  .recharts-cartesian-grid-horizontal line, .recharts-cartesian-grid-vertical line{stroke:var(--border);}
  .recharts-label{fill:var(--bone-dim);font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;}
  ::selection{background:rgba(29,111,218,.18);color:var(--ink);}
  html.lh-preview-edit [data-i18n-key]{cursor:text;border-radius:3px;transition:outline-color .15s ease, background .15s ease;}
  html.lh-preview-edit [data-i18n-key]:hover{outline:1px dashed rgba(29,111,218,.5);background:rgba(29,111,218,.08);}
  .btn-ember{background:var(--accent);border:1px solid var(--accent);box-shadow:0 1px 2px rgba(29,111,218,0.25);color:var(--on-accent);}
  .btn-ember:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
  .btn-bone{background:var(--surface);border:1px solid var(--border);color:var(--ink);}
  .btn-bone:hover{border-color:var(--accent);color:var(--accent);}
  .logo-mark{width:22px;height:22px;position:relative;flex-shrink:0;}
  .logo-mark::before,.logo-mark::after{content:"";position:absolute;inset:0;border-radius:999px;}
  .logo-mark::before{background:radial-gradient(circle at 50% 60%, rgba(29,111,218,0.9), rgba(29,111,218,0.0) 65%);}
  .logo-mark::after{border:1.25px solid rgba(10,13,20,0.85);mask:radial-gradient(circle at 50% 120%, #000 48%, transparent 50%);-webkit-mask:radial-gradient(circle at 50% 120%, #000 48%, transparent 50%);}
</style>
