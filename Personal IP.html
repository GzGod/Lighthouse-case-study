<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>灯塔 · 个人 IP 案例</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Inter+Tight:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="/shared-nav.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --canvas:#f5f6f8; --surface:#ffffff; --surface-muted:#f0f2f5; --elevated:#ffffff;
    --ink:#151a23; --ink-2:#11151c; --ink-3:#ffffff;
    --bone:#151a23; --bone-dim:#586575; --secondary:#586575; --subtle:#687587;
    --accent:#08748c; --accent-soft:#08748c; --accent-hover:#06647a; --on-accent:#ffffff;
    --brand:#089bb3; --display-accent:#0099b2; --cyan:#06b6d4; --teal:#08748c;
    --ember:#08748c; --ember-soft:#08748c; --amber:#e6bd78;
    --border:#e2e6eb; --rule:#e2e6eb; --rule-strong:#d0d6df; --control-border:#cbd2da; --accent-border:#b9dce5;
    --success:#217358; --warning:#8b541b; --danger:#ac3546;
  }
  html,body{background:var(--canvas);color:var(--ink);font-family:"Inter","Noto Sans SC",system-ui,-apple-system,sans-serif;}
  html[lang="en"] .font-cn{font-family:"Inter",system-ui,sans-serif;}
  html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{overflow-wrap:anywhere;}
  .font-display{font-family:"Inter Tight","Inter","Noto Serif SC",serif;font-feature-settings:"ss01";letter-spacing:-0.015em;}
  .font-mono{font-family:"JetBrains Mono",ui-monospace,monospace;}
  .font-cn{font-family:"Inter","Noto Sans SC",system-ui,sans-serif;}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  .kicker{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--bone-dim);}
  .rule-t{border-top:1px solid var(--border);}
  .grid-bg{
    background-image:
      linear-gradient(to right, rgba(8,116,140,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(8,116,140,0.05) 1px, transparent 1px);
    background-size:80px 80px;
  }
  .ember-glow{text-shadow:none;}
  .teal-glow{text-shadow:none;}
  .bone-glow{text-shadow:none;}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.6,.2,1), transform .9s cubic-bezier(.2,.6,.2,1);}
  .reveal.in{opacity:1;transform:translateY(0);}
  .hairline{height:1px;background:linear-gradient(to right, transparent, var(--rule-strong), transparent);}
  ::selection{background:rgba(8,116,140,.18);color:var(--ink);}
  html.lh-preview-edit [data-i18n-key]{cursor:text;border-radius:3px;transition:outline-color .15s ease, background .15s ease;}
  html.lh-preview-edit [data-i18n-key]:hover{outline:1px dashed rgba(8,116,140,.5);background:rgba(8,116,140,.08);}
  .btn-ember{
    background:var(--accent);
    border:1px solid var(--accent);
    box-shadow:0 1px 2px rgba(8,116,140,0.2);
    color:var(--on-accent);
  }
  .btn-bone{background:var(--surface);border:1px solid var(--border);color:var(--ink);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="personal-ip.jsx"></script>
</body>
</html>
